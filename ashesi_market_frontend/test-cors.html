<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
        .result { padding: 20px; margin: 20px 0; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>CORS Diagnostic Test</h1>
    <p>This page tests if CORS is working between Vercel and Railway.</p>
    
    <div id="location-info" class="result info">
        <strong>Current Location:</strong><br>
        <span id="current-url"></span>
    </div>
    
    <button onclick="testCORS()">Test CORS Request</button>
    
    <div id="result"></div>
    
    <script>
        // Display current URL
        document.getElementById('current-url').textContent = window.location.href;
        
        async function testCORS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result info">Testing...</div>';
            
            const apiUrl = 'https://ashesi-market-website-production.up.railway.app/api/auth/password-reset/request/';
            const testEmail = 'test@ashesi.edu.gh';
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email: testEmail })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ CORS is working!</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ CORS Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p><strong>This means:</strong> The browser blocked the request due to CORS policy.</p>
                        <h4>Debugging Info:</h4>
                        <ul>
                            <li>Origin: ${window.location.origin}</li>
                            <li>Target: ${apiUrl}</li>
                            <li>Error Type: ${error.name}</li>
                        </ul>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
