<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Ashesi Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a class="brand" href="index.html">
                <span class="brand-icon">🛍</span>
                <span class="brand-text">Ashesi Market</span>
            </a>
        </div>
    </nav>

    <main class="site-main">
        <div class="container" style="max-width: 480px; margin-top: 60px;">
            <div class="card">
                <h1 style="font-family: var(--font-brand); margin-bottom: 8px;">Forgot Password</h1>
                <p style="color: var(--c-muted); margin-bottom: 24px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div id="alert-container"></div>

                <form id="forgot-password-form" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="your.email@ashesi.edu.gh">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                        Send Reset Link
                    </button>
                </form>

                <div style="text-align: center; margin-top: 20px;">
                    <a href="login.html" style="color: var(--c-accent); text-decoration: none;">
                        ← Back to Login
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Ashesi Market — Ashesi University Student Marketplace</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function handleSubmit(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const alertContainer = document.getElementById('alert-container');
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/password-reset/request/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <strong>Email Sent!</strong><br>
                            If an account exists with this email, you will receive a password reset link shortly.
                            Please check your inbox and spam folder.
                        </div>
                    `;
                    
                    // Clear form
                    document.getElementById('forgot-password-form').reset();
                    
                    // Redirect to login after 5 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 5000);
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-error">
                            ${data.error || 'Failed to send reset email. Please try again.'}
                        </div>
                    `;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            } catch (error) {
                console.error('Error:', error);
                alertContainer.innerHTML = `
                    <div class="alert alert-error">
                        Network error. Please check your connection and try again.
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
