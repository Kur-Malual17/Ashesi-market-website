<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Ashesi Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a class="brand" href="index.html">
                <span class="brand-icon">🛍</span>
                <span class="brand-text">Ashesi Market</span>
            </a>
        </div>
    </nav>

    <main class="site-main">
        <div class="container" style="max-width: 480px; margin-top: 60px;">
            <div class="card">
                <h1 style="font-family: var(--font-brand); margin-bottom: 8px;">Reset Password</h1>
                <p style="color: var(--c-muted); margin-bottom: 24px;">
                    Enter your new password below.
                </p>

                <div id="alert-container"></div>

                <form id="reset-password-form" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" required 
                               minlength="8" placeholder="At least 8 characters">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required 
                               minlength="8" placeholder="Re-enter password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                        Reset Password
                    </button>
                </form>

                <div style="text-align: center; margin-top: 20px;">
                    <a href="login.html" style="color: var(--c-accent); text-decoration: none;">
                        ← Back to Login
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Ashesi Market — Ashesi University Student Marketplace</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Get token and uid from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const uid = urlParams.get('uid');

        // Check if token and uid exist
        if (!token || !uid) {
            document.getElementById('alert-container').innerHTML = `
                <div class="alert alert-error">
                    Invalid reset link. Please request a new password reset.
                </div>
            `;
            document.getElementById('reset-password-form').style.display = 'none';
        }

        async function handleSubmit(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const submitBtn = document.getElementById('submit-btn');
            const alertContainer = document.getElementById('alert-container');
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                alertContainer.innerHTML = `
                    <div class="alert alert-error">
                        Passwords do not match!
                    </div>
                `;
                return;
            }
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/password-reset/confirm/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        uid: uid,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <strong>Success!</strong><br>
                            Your password has been reset. Redirecting to login...
                        </div>
                    `;
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-error">
                            ${data.error || 'Failed to reset password. The link may have expired.'}
                        </div>
                    `;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                alertContainer.innerHTML = `
                    <div class="alert alert-error">
                        Network error. Please check your connection and try again.
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
