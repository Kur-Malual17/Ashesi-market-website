name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ashesi_market_frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ashesi_market_frontend/**'

jobs:
  lint:
    name: Lint Frontend Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check JavaScript syntax
      working-directory: ./ashesi_market_frontend
      run: |
        echo "Checking JavaScript files..."
        # Check for syntax errors in JS files
        for file in js/*.js; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            node --check "$file" && echo "✅ $file is valid" || echo "❌ $file has errors"
          fi
        done
        echo "✅ JavaScript syntax check complete"
    
    - name: Check HTML files exist
      working-directory: ./ashesi_market_frontend
      run: |
        echo "Checking HTML files..."
        if ls *.html 1> /dev/null 2>&1; then
          echo "✅ HTML files found"
          ls -la *.html | head -10
        else
          echo "⚠️ No HTML files found"
        fi
    
    - name: Check CSS files exist
      working-directory: ./ashesi_market_frontend
      run: |
        echo "Checking CSS files..."
        if ls css/*.css 1> /dev/null 2>&1; then
          echo "✅ CSS files found"
          ls -la css/*.css
        else
          echo "⚠️ No CSS files found"
        fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check for secrets in code
      run: |
        echo "Scanning for potential secrets..."
        # Check for common secret patterns
        if grep -r -i "password.*=.*['\"].*['\"]" ashesi_market_frontend/js/ --exclude-dir=node_modules 2>/dev/null; then
          echo "⚠️ Warning: Potential hardcoded passwords found"
        else
          echo "✅ No hardcoded passwords detected"
        fi
        if grep -r -i "api[_-]key.*=.*['\"].*['\"]" ashesi_market_frontend/js/ --exclude-dir=node_modules 2>/dev/null; then
          echo "⚠️ Warning: Potential hardcoded API keys found"
        else
          echo "✅ No hardcoded API keys detected"
        fi
        echo "✅ Security scan complete"

  deploy:
    name: Deploy to Vercel
    needs: [lint, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Vercel
      run: |
        echo "✅ Vercel auto-deploys from GitHub"
        echo "Check your Vercel dashboard for deployment status"
        echo "Vercel will automatically deploy when changes are pushed to main branch"
