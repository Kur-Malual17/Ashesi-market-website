name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ashesi_market_django/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ashesi_market_django/**'

jobs:
  test:
    name: Test Django Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./ashesi_market_django
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort
    
    - name: Lint with flake8
      working-directory: ./ashesi_market_django
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,venv,env
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=migrations,venv,env
    
    - name: Check code formatting with black
      working-directory: ./ashesi_market_django
      run: |
        black --check --exclude='migrations|venv|env' .
      continue-on-error: true
    
    - name: Check import sorting with isort
      working-directory: ./ashesi_market_django
      run: |
        isort --check-only --skip migrations --skip venv --skip env .
      continue-on-error: true
    
    - name: Run Django tests
      working-directory: ./ashesi_market_django
      env:
        SECRET_KEY: 'test-secret-key-for-ci-only'
        DEBUG: 'True'
        DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'
        CORS_ALLOWED_ORIGINS: 'http://localhost:3000'
      run: |
        python manage.py migrate --noinput
        python manage.py test --noinput
    
    - name: Check for missing migrations
      working-directory: ./ashesi_market_django
      env:
        SECRET_KEY: 'test-secret-key-for-ci-only'
        DEBUG: 'True'
      run: |
        python manage.py makemigrations --check --dry-run --noinput

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Railway
      run: |
        echo "✅ Railway auto-deploys from GitHub"
        echo "Check your Railway dashboard for deployment status"
        echo "Railway will automatically deploy when changes are pushed to main branch"
