name: Full Stack CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check for changes
      uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          backend:
            - 'ashesi_market_django/**'
          frontend:
            - 'ashesi_market_frontend/**'

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.frontend == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      working-directory: ./ashesi_market_django
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start Django server
      working-directory: ./ashesi_market_django
      env:
        SECRET_KEY: 'test-secret-key-for-ci-only'
        DEBUG: 'True'
      run: |
        python manage.py migrate --noinput
        python manage.py runserver 8000 &
        sleep 5
    
    - name: Test API endpoints
      run: |
        echo "Testing API health..."
        curl -f http://localhost:8000/api/ || echo "API endpoint check"
        echo "✅ Integration tests complete"

  deploy-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [check-changes, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deployment Summary
      run: |
        echo "🚀 Deployment Summary"
        echo "===================="
        echo ""
        if [ "${{ needs.check-changes.outputs.backend }}" == "true" ]; then
          echo "✅ Backend changes detected - Railway will auto-deploy"
          echo "   📍 https://ashesi-market-website-production.up.railway.app"
        fi
        if [ "${{ needs.check-changes.outputs.frontend }}" == "true" ]; then
          echo "✅ Frontend changes detected - Vercel will auto-deploy"
          echo "   📍 https://ashesi-market-website.vercel.app"
        fi
        echo ""
        echo "Monitor deployments:"
        echo "  - Railway: https://railway.app/dashboard"
        echo "  - Vercel: https://vercel.com/dashboard"
