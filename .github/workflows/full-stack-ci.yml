name: Full Stack CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      working-directory: ./ashesi_market_django
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run migrations
      working-directory: ./ashesi_market_django
      env:
        SECRET_KEY: 'test-secret-key-for-ci-only'
        DEBUG: 'True'
      run: |
        python manage.py migrate --noinput
    
    - name: Check Django setup
      working-directory: ./ashesi_market_django
      env:
        SECRET_KEY: 'test-secret-key-for-ci-only'
        DEBUG: 'True'
      run: |
        python manage.py check
        echo "✅ Django setup is valid"

  deploy-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deployment Summary
      run: |
        echo "🚀 Deployment Summary"
        echo "===================="
        echo ""
        echo "✅ Backend - Railway will auto-deploy"
        echo "   📍 https://ashesi-market-website-production.up.railway.app"
        echo ""
        echo "✅ Frontend - Vercel will auto-deploy"
        echo "   📍 https://ashesi-market-website.vercel.app"
        echo ""
        echo "Monitor deployments:"
        echo "  - Railway: https://railway.app/dashboard"
        echo "  - Vercel: https://vercel.com/dashboard"
